<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolgozói Felület - Állatmenhely</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard_body">
    <div class="dashboard_wrapper">
        <aside class="sidebar">
            <h2>Állatmenhely</h2>
            <p class="role_badge">Dolgozói fiók</p>
            <nav class="sidebar_nav">
                <button class="nav_btn active" onclick="showTab('appointments')">📅 Időpontok</button>
                <button class="nav_btn" onclick="showTab('animals')">🐾 Állatok</button>
                <a href="login.html" class="nav_link logout">Kijelentkezés</a>
            </nav>
        </aside>

        <main class="dashboard_content">
            <section id="appointments" class="tab_content active_tab">
                <div class="content_header">
                    <h2>Látogatási foglalások</h2>
                </div>
                <table class="data_table">
                    <thead>
                        <tr>
                            <th>Név</th>
                            <th>E-mail</th>
                            <th>Telefon</th>
                            <th>Állat</th>
                            <th>Foglalás napja</th>
                            <th>Státusz</th>
                            <th>Művelet</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>

            <section id="animals" class="tab_content">
                <div class="content_header">
                    <h2>Állatok kezelése (SQL mezők)</h2>
                    <button class="button btn_new_animal">+ Új állat</button>
                </div>
                <div style="overflow-x: auto;">
                    <table class="data_table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Név</th>
                                <th>Szín</th>
                                <th>Fajta</th>
                                <th>Kor (kb. év)</th>
                                <th>Súly (kg)</th>
                                <th>Mag. (cm)</th>
                                <th>Gondozó ID</th>
                                <th>Státusz</th>
                                <th>Művelet</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
