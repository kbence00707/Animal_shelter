<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejelentkezés - Állatmenhely</title>
    <link rel="stylesheet" href="style.css?v=20261021">
    <script src="theme.js?v=20261021"></script>
</head>
<body class="login_page">
    <header>
        <div class="navigation">
            <div class="brandname">
                <span>Állatmenhely</span>
            </div>
            <nav>
                <a href="index.html">Vissza a főoldalra</a>
                <button id="theme_toggle" class="theme_toggle" title="Sötét mód">🌙</button>
            </nav>
        </div>
    </header>

    <main class="login_main">
        <div class="login_card">
            <h2>Munkatársi Bejelentkezés</h2>
            <p>Lépj be munkatársi fiókoddal.</p>
            <form id="login_form" class="booking_form">
                <label>E-mail cím 
                    <input autocomplete="username" id="login_email" type="email" placeholder="pl. nev@mihalyimenhely.hu" required>
                </label>
                <label>Jelszó 
                    <input autocomplete="current-password" id="login_password" type="password" placeholder="Jelszó megadása" required>
                </label>
                <button class="button" type="submit">Belépés</button>
            </form><p id="login_message" class="message" role="status" aria-live="polite"></p>
        </div>
    </main>

    <footer class="site_footer">
        <div class="footer_bottom">
            <p>&copy; 2026 Állatmenhely Mihályi. Minden jog fenntartva.</p>
        </div>
    </footer>

    <script src="api-config.js?v=20261021"></script>
    <script src="auth-api.js?v=20261021"></script>
    <script src="script.js?v=20261021"></script>
</body>
</html>
